name: Dear Alex CI

on:
  push:
    branches: [ main, "jules*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          cd backend
          ruff check .

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check .

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

  frontend-check:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Unit tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Run Build & Typecheck
        run: |
          cd frontend
          npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            scripts/requirements-e2e.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r scripts/requirements-e2e.txt
          cd frontend && npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/requirements-e2e.txt') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start backend and built frontend
        run: |
          cd backend
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          cd ../frontend
          nohup npx vite preview --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/frontend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "Both servers healthy"; exit 0
            fi
            sleep 1
          done
          echo "Servers did not become healthy"; cat "$RUNNER_TEMP"/*.log; exit 1

      - name: Run end-to-end suite
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts
        run: python scripts/automated_system_test.py --headless

      - name: Upload screenshots, traces and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: |
            ${{ runner.temp }}/e2e-artifacts
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: warn
