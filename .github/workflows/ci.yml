name: Dear Alex CI

on:
  push:
    branches: [ main, "jules*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: |
          cd backend
          ruff check .

      - name: Ruff format check
        run: |
          cd backend
          ruff format --check .

      - name: Run Pytest
        run: |
          cd backend
          pytest -v

  frontend-check:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Run Build & Typecheck
        run: |
          cd frontend
          npm run build
